[project]
name = "guitar-assistant"
version = "0.1.0"
description = "Implementation of a multi-tool AI agent for answering questions about electric guitar specifications"
readme = "README.md"
authors = [
    { email = "felix.martin.schmitt@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "httpx>=0.28.1",
    "langchain>=1.3.13",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "mlflow>=3.14.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
guitar-assistant = "guitar_assistant:main"
guitar-assistant-package = "guitar_assistant:package"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.1",
    "pylint>=4.0.6",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
explore = [
    "streamlit>=1.40",
]

[tool.pytest.ini_options]
markers = [
    "integration: hits a real network API (OpenAI or Wikipedia), slow/costs money; excluded by default",
]
addopts = "--strict-markers -m 'not integration'"

[tool.ruff]
line-length = 100

[tool.pylint.format]
max-line-length = 100

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
