repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pylint-src
        name: pylint (src)
        entry: uv run pylint
        language: system
        types: [python]
        files: ^src/
      - id: pylint-tests
        name: pylint (tests)
        entry: >-
          uv run pylint
          --disable=missing-function-docstring,too-few-public-methods,protected-access,unused-argument
        language: system
        types: [python]
        files: ^tests/
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
